<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JB 產品保固查詢</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9cbd0'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='800' text-anchor='middle' fill='%23111'%3EJB%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#121214;--card:#1c1d21;--line:#2c2e34;--text:#ececef;--muted:#9a9ca5;--silver:#c9cbd0;
        --ok:#3ecf8e;--warn:#f5b84a;--bad:#ef5a5a;--accent:#d8dadf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6}
  main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo{font-weight:800;letter-spacing:.12em;font-size:15px;color:var(--silver);text-decoration:none}
  .logo b{color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .hero{background:linear-gradient(180deg,#d9dbe0,#b9bcc3);color:#111;border-radius:14px;padding:20px 20px 18px;margin-bottom:14px}
  .hero h1{margin:4px 0 4px;font-size:26px;line-height:1.3;letter-spacing:.02em}
  .hero p{margin:0;font-size:14.5px;opacity:.8}
  .kicker{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.65}
  .hero-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .hero-links a{background:rgba(255,255,255,.45);border-radius:10px;padding:9px 10px;color:#111;text-decoration:none;font-weight:700;font-size:14.5px}
  .hero-links small{display:block;font-weight:400;font-size:11.5px;opacity:.65}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,18,20,0),rgba(18,18,20,.96) 35%);z-index:5}
  .dock a{max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:#06C755;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .plate{background:linear-gradient(180deg,#d9dbe0,#b9bcc3);color:#111;border-radius:14px;padding:20px 20px 18px;margin-bottom:14px}
  h2.section{font-size:13px;color:var(--muted);letter-spacing:.14em;margin:30px 4px 10px;font-weight:700}
  details.qa{border-top:1px solid var(--line);padding:10px 0}
  details.qa:first-of-type{border-top:0}
  details.qa summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
  details.qa summary::-webkit-details-marker{display:none}
  details.qa summary::after{content:"+";color:var(--muted);font-weight:400}
  details.qa[open] summary::after{content:"−"}
  details.qa[open] summary{margin-bottom:6px}
  details.terms-box summary{cursor:pointer;font-weight:700;padding:2px 0;list-style:none;display:flex;justify-content:space-between}
  details.terms-box summary::-webkit-details-marker{display:none}
  details.terms-box summary::after{content:"+";color:var(--muted);font-weight:400}
  details.terms-box[open] summary::after{content:"−"}
  details.terms-box[open] summary{margin-bottom:8px}
  .vbox{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 14px;border-radius:10px;overflow:hidden;background:#000}
  .vbox.tall{aspect-ratio:9/16;max-width:300px;margin-left:auto;margin-right:auto}
  .vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pframe{background:linear-gradient(180deg,#d9dbe0,#b9bcc3);border-radius:10px;padding:12px;margin:0 0 14px}
  .pframe img{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
  .plate .model{font-weight:800;font-size:24px;letter-spacing:.02em}
  .plate .name{font-weight:700;font-size:15px}
  .plate .en{font-size:12px;letter-spacing:.08em;opacity:.8}
  .plate .sn{font-family:Consolas,monospace;font-weight:700;margin-top:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
  .b-ok{background:rgba(62,207,142,.15);color:var(--ok)} .b-warn{background:rgba(245,184,74,.15);color:var(--warn)}
  .b-bad{background:rgba(239,90,90,.15);color:var(--bad)}
  .genuine{color:var(--ok);font-weight:700;margin-bottom:8px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0}
  dt{color:var(--muted)} dd{margin:0;font-weight:600}
  h2{font-size:18px;margin:0 0 10px}
  .desc{white-space:pre-line;color:var(--text)}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#121317;color:var(--text);font-size:16px}
  button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#111;font-weight:800;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  button.pick{display:block;text-align:left;background:#121317;color:var(--text);border:1px solid var(--line);font-weight:600;margin-top:10px}
  button.pick .note{margin:2px 0 6px}
  .spin{display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-3px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{font-size:13px;color:var(--muted)}
  .site-foot{text-align:center;font-size:12px;line-height:1.8;color:var(--muted);opacity:.7;padding:8px 16px 96px}
  .site-foot .ver{display:block;font-size:11px;opacity:.6;letter-spacing:.05em}
  .fixed{margin:0;padding:11px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:15px}
  .desc .li{padding-left:1em;text-indent:-1em}
  .desc .gap{height:.6em}
  .rfig{margin:8px 0 10px}
  .rfig img{display:block;width:100%;max-width:320px;height:auto;border-radius:10px;border:1px solid var(--line)}
  .rfig figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
  .terms{font-size:14px;color:var(--muted)}
  .privacy{margin:14px 0 0}
  .tip{background:rgba(245,184,74,.12);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;margin:0 0 8px}
  .err{color:var(--bad);font-weight:700}
  a{color:var(--silver)}
  .line-btn{display:block;text-align:center;margin:8px 0 6px;padding:11px 12px;border-radius:12px;background:#06C755;color:#fff;font-weight:800;font-size:16px;text-decoration:none;line-height:1.35}
  .line-btn small{display:block;font-weight:600;font-size:12.5px;opacity:.9;letter-spacing:.03em}
  .social-title{margin:16px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#121317;color:var(--text);text-decoration:none;font-size:14px}
  .chip b{font-weight:700;color:var(--muted);font-size:12.5px}
  .guide-btns{display:grid;gap:8px;margin:0 0 14px}
  .guide-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#121317;color:var(--text);text-decoration:none}
  .guide-btn .gi{font-size:22px;line-height:1}
  .guide-btn b{display:block;font-size:15.5px}
  .guide-btn small{display:block;color:var(--muted);font-size:12.5px}
  .guide-btn::after{content:"›";margin-left:auto;color:var(--muted);font-size:22px}
  .loading{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<main>
  <header><a class="logo" href="./"><b>JB</b> CAR TECH LAB</a></header>
  <div id="app"><div class="loading">查詢中…</div></div>
</main>
<div class="dock"><a href="https://lin.ee/WItu7Ju" target="_blank" rel="noopener">💬 有問題？LINE 客服 @922kpahu</a></div>
<footer class="site-foot">© 2026 JB CAR TECH LAB<br>Designed by focuswagonjie<span class="ver" id="ver"></span></footer>
<script>
// ★ 部署 Apps Script 後，把「網頁應用程式網址」貼到這裡
const API_URL = "https://script.google.com/macros/s/AKfycbwW6cVUaaKrmGk8QBFLBNxADI74mFKTtqfoVvI-eaaAqwtRq9oNiKyJZC119Qr0ISgSNg/exec";

const qs = new URLSearchParams(location.search);
const SN = (qs.get("s") || "").trim(), KEY = (qs.get("k") || "").trim();
const app = document.getElementById("app");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const c of kids) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
// 文字轉超連結：支援 [顯示文字](網址) 與直接貼的 https:// 網址；只允許 http(s) / tel: / mailto:
// 多行文字：每行一個區塊；「・」「•」「-」開頭的行換行時對齊項目符號後的文字；空行 = 段落間距
function richText(text) {
  return String(text).split(/\r?\n/).map(line => {
    const t = line.trim();
    if (!t) return el("div", { class: "gap" });
    // 圖片：整行寫 ![說明](檔名.webp)；只接受與網頁同資料夾的檔名或 https 網址
    const im = t.match(/^!\[([^\]]*)\]\(((?:https:\/\/)?[\w./-]+\.(?:webp|png|jpe?g|gif))\)$/i);
    if (im) {
      const img = el("img", { class: "rimg", src: im[2], alt: im[1], loading: "lazy", decoding: "async" });
      const fig = el("figure", { class: "rfig" }, img, im[1] ? el("figcaption", {}, im[1]) : null);
      img.addEventListener("error", () => fig.remove());
      return fig;
    }
    return el("div", { class: /^[・•\-]/.test(t) ? "li" : "" }, ...linkify(t));
  });
}
function linkify(text) {
  const out = [], re = /\[([^\]]+)\]\(((?:https?:\/\/|tel:|mailto:)[^\s)]+)\)|(https?:\/\/[^\s<>()（）]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.push(text.slice(last, m.index));
    const href = m[2] || m[3], label = m[1] || m[3];
    out.push(el("a", href.startsWith("http") ? { href, target: "_blank", rel: "noopener" } : { href }, label));
    last = re.lastIndex;
  }
  out.push(text.slice(last));
  return out;
}
// 客服區：LINE 連結做成主要按鈕（優先聯繫），其他社群連結（Facebook、TikTok…）縮成「最新資訊」小字
function supportNodes(text) {
  if (!text) return ["客服資訊準備中"];
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>()（）]+)/g, links = [];
  let m; while ((m = re.exec(text))) links.push({ href: m[2] || m[3], label: m[1] || m[3] });
  const isLine = l => /lin\.ee|line\.me/i.test(l.href);
  const line = links.find(isLine);
  if (!line) return [el("div", { class: "desc" }, ...linkify(text))];
  const others = links.filter(l => !isLine(l));
  const rest = text.replace(re, "").split(/\n/).map(t => t.trim()).filter(Boolean);   // 連結以外的文字（電話、Email、營業時間…）照常顯示
  return [
    el("a", { class: "line-btn", href: line.href, target: "_blank", rel: "noopener" }, "💬 加入 LINE 客服諮詢",
      (line.label.match(/@[\w.-]+/) ? el("small", {}, "LINE ID " + line.label.match(/@[\w.-]+/)[0]) : null)),
    el("p", { class: "note" }, "安裝、保固、產品問題請優先透過 LINE 客服聯繫，回覆最快。"),
    ...rest.map(t => el("div", { class: "desc" }, ...linkify(t))),
    others.length ? el("p", { class: "note social-title" }, "最新消息與活動") : null,
    others.length ? el("div", { class: "chips" }, ...others.map(l => {   // 標籤格式「名稱 | 平台」→ 顯示「平台 名稱」
      const [name, plat] = l.label.includes("|") ? l.label.split("|").map(t => t.trim()) : ["", l.label];
      return el("a", { class: "chip", href: l.href, target: "_blank", rel: "noopener" }, el("b", {}, plat), name);
    })) : null,
  ].filter(Boolean);
}
const STATUS = {
  active: ["b-ok", "✓ 保固中"], expired: ["b-bad", "保固已過期"], repair: ["b-warn", "維修處理中"],
  replaced: ["b-warn", "已更換新品"], notShipped: ["b-warn", "尚未出貨登記"], void: ["b-bad", "序號已作廢"],
  "待安裝登記": ["b-warn", "保固尚未啟用"]   // 店家件未登記（試算表狀態欄寫「待安裝登記」）
};

async function api(params) {
  const u = new URL(API_URL); Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString()); return r.json();
}

// ── 產品共用元件（保固頁與官網首頁共用）
function plateBox(p, sn) {   // 銀色名牌：型號 / 名稱 / 英文名 ｜ 車型 / （序號）
  return el("div", { class: "plate" },
    el("div", { class: "kicker" }, sn ? "WARRANTY CHECK" : "PRODUCT"),
    el("div", { class: "model" }, p.model), el("div", { class: "name" }, p.name),
    el("div", { class: "en" }, (p.nameEn || "") + (p.vehicle ? " ｜ FOR " + p.vehicle.toUpperCase() : "")),
    sn ? el("div", { class: "sn" }, "SN: " + sn) : null);
}
function featureCard(p) {    // 功能說明：上方放產品圖（與 index.html 同資料夾的「<型號>.webp」；找不到就不顯示）
  const pimg = el("img", { src: encodeURIComponent(p.model) + ".webp", alt: p.model + " 產品圖", width: "720", height: "489", decoding: "async", loading: "lazy" });
  const pframe = el("div", { class: "pframe" }, pimg);
  pimg.addEventListener("error", () => pframe.remove());
  return el("div", { class: "card" }, el("h2", {}, "功能說明"), pframe, videoBox(p.video),
    p.description ? el("div", { class: "desc" }, ...richText(p.description)) : null);
}
// YouTube 影片（試算表「影片」欄貼網址）：支援 youtu.be / watch?v= / shorts / embed；Shorts 直式，其他橫式
function videoBox(url) {
  const m = String(url || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/);
  if (!m) return null;
  const tall = /\/shorts\//.test(url);
  return el("div", { class: "vbox" + (tall ? " tall" : "") },
    el("iframe", { src: "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0&playsinline=1", title: "產品影片",
      loading: "lazy", allow: "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen", allowfullscreen: "" }));
}
// 車主手冊按鈕：安裝手冊（試算表「安裝說明連結」有網址才顯示）＋ 保固登記教學（固定 register.html）
function manualLine(p) {
  const btn = (href, icon, t, sub) => el("a", { class: "guide-btn", href }, el("span", { class: "gi" }, icon), el("span", {}, el("b", {}, t), el("small", {}, sub)));
  const list = [btn("register.html", "📝", "保固登記教學", "安裝前先登記・約 1 分鐘")];   // 順序 = 車主流程：先登記、再安裝
  if (/^(https?:\/\/|[\w-]+\.html)/i.test(p.manual || "")) list.push(btn(p.manual, "🔧", "自行安裝手冊", "圖文步驟・約 20 分鐘"));
  return el("div", { class: "guide-btns" }, ...list);
}

function render(d) {
  app.replaceChildren();
  if (!d.ok) { app.append(el("div", { class: "card" }, el("p", { class: "err" }, d.error || "查詢失敗"))); return; }
  app.append(plateBox(d, d.sn));

  const [cls, txt] = STATUS[d.status] || ["b-warn", d.status];
  const card = el("div", { class: "card" }, el("div", { class: "genuine" }, "✔ 正版商品認證"), el("span", { class: "badge " + cls }, txt));
  const dl = el("dl");
  const row = (k, v) => v && dl.append(el("dt", {}, k), el("dd", {}, v));
  row("適用車型", d.vehicle);
  if (d.status === "待安裝登記" && !d.needShop) row("保固起算", "尚未登記");   // 自行安裝件期限內未登記
  if (d.start) row("保固起算", d.start + (d.startByInstall ? (d.needShop ? "（安裝日）" : "（登記日）") : "（依出貨日自動起算）"));
  if (d.end) row("保固到期", d.end + (d.status === "active" ? `（剩 ${d.daysLeft} 天）` : ""));
  row("保固期", d.warrantyMonths + " 個月");
  if (d.registered) row("安裝店家", d.shop || "—");
  if (d.registered) row("登記車牌", d.plate);
  row("PCB / 韌體", [d.pcb, d.fw].filter(Boolean).join(" / "));
  card.append(dl);
  if (d.status === "待安裝登記") card.append(el("p", { class: "note" }, d.needShop ? "此商品由授權店家安裝，店家完成安裝登記後，保固才開始起算。"
    : `請於 ${d.registerDeadline} 前完成登記，保固從登記當天起算。`));
  if (d.status === "active" && !d.registered && d.canRegister)   // 逾期未登記：保固已自動起算，但提醒補登
    card.append(el("p", { class: "tip" }, "⚠ 尚未登記：保固已依出貨日自動起算。請盡速於下方登記聯絡電話與車牌，確保保固資料完整，日後維修、更換更順利。"));
  if (d.justRegistered) card.append(el("p", { class: "note" }, "✓ 保固登記完成"));
  else if (d.registered) card.append(el("p", { class: "note" }, "如登記資料有誤或非本人登記，請聯絡客服或安裝店家。"));
  app.append(card);
  if (!d.needShop) app.append(manualLine(d));   // 車主手冊放在狀態卡下方；店家件不顯示（店家有 PDF 手冊）

  if (d.canRegister) app.append(registerForm(d));

  app.append(featureCard(d));
  if (d.terms) app.append(el("div", { class: "card" }, el("h2", {}, "保固與注意事項"), el("div", { class: "desc terms" }, ...richText(d.terms))));
  // 常見問題：店家件登記前（店家登記畫面）不顯示；登記後車主查詢仍顯示，方便故障排除
  const fc = (d.needShop && !d.registered) ? null : faqCard(d.faq); if (fc) app.append(fc);
  const links = el("div", { class: "card" }, el("h2", {}, "客服"));
  links.append(...supportNodes(d.support));
  app.append(links);
}

// 車牌顯示用（與後端 fmtPlate_ 相同規則）：ABC1234 → ABC-1234；實際寫入以後端為準
function fmtPlate(s) {
  const v = String(s || "").toUpperCase().replace(/\s/g, "");
  if (v.includes("-")) return v;
  const m = v.match(/^([A-Z]+)(\d+)$/) || v.match(/^(\d+)([A-Z]+)$/);
  return m ? m[1] + "-" + m[2] : v;
}

function registerForm(d) {
  const now = new Date(); const iso = new Date(now.getTime() - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const date = el("input", { type: "date", min: d.registerMin, max: iso, value: iso, required: "" });   // 店家件：預設今天，可往回選
  const shop = el("input", { type: "text", maxlength: "30", autocomplete: "off", autocapitalize: "characters", placeholder: "由安裝店家填寫", required: "" });
  const phone = el("input", { type: "tel", inputmode: "numeric", maxlength: "15", placeholder: "例如 0912345678", required: "" });
  const plate = el("input", { type: "text", maxlength: "10", autocapitalize: "characters", autocomplete: "off", placeholder: "例如 ABC-1234", required: "" });
  // 輸入時即時過濾：電話只留數字；車牌只留英文、數字、-（自動轉大寫）
  const only = (inp, fn) => inp.addEventListener("input", () => { const v = fn(inp.value); if (v !== inp.value) inp.value = v; });
  only(phone, v => v.replace(/\D/g, ""));
  only(plate, v => v.toUpperCase().replace(/[^A-Z0-9-]/g, ""));
  const shopFields = d.needShop ? [el("label", {}, "店家代碼（授權店家安裝時由店家填寫）（必填）"), shop] : [];
  const msg = el("p", { class: "err" });
  // 店家件（期限內）：選安裝日（預設今天）；自行安裝件或逾期：保固起算固定為出貨日 + N 天，不能選
  const late = d.lateRegister;                       // 逾期：起算日固定為出貨日 + N 天
  const selfNow = !d.needShop && !d.lateRegister;    // 自行安裝件期限內：從登記當天起算
  const BTN = "登記保固";
  const btn = el("button", { type: "submit" }, BTN);
  const dateFields = selfNow
    ? [el("label", {}, "保固起算日"), el("p", { class: "fixed" }, `${iso}（今天登記，從登記日起算）`)]
    : late
    ? [el("label", {}, "保固起算日"), el("p", { class: "fixed" }, `${d.start}（出貨日 + ${d.defaultDays} 天自動起算）`)]
    : [el("label", {}, "安裝日期（必填，預設今天）"), date];
  const form = el("form", { class: "card", novalidate: "" },
    el("h2", {}, d.needShop && d.lateRegister ? "補登保固資料" : "保固登記"),
    d.needShop ? el("p", { class: "tip" }, "本商品為授權店家安裝件，請由安裝店家協助登記。") : null,
    el("p", { class: "note" }, selfNow
      ? `${d.registerDeadline} 前登記，保固從登記當天起算；未登記則自出貨日 + ${d.defaultDays} 天起算。送出後不可自行修改。`
      : late
      ? `保固已自動起算。請登記聯絡資料，方便日後保固服務；送出後不可自行修改。`
      : "保固自安裝日起算。請於安裝完成後登記，送出後不可自行修改。"),
    ...dateFields, ...shopFields,
    el("label", {}, "車主聯絡電話（必填）"), phone, el("label", {}, "車牌號碼（必填）"), plate,
    el("p", { class: "note privacy" }, "電話與車牌僅用於保固服務聯絡與身分核對，不會提供給第三方。"),
    btn, msg);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const miss = [...(late ? [] : [[date, "安裝日期"]]), ...(d.needShop ? [[shop, "店家代碼"]] : []), [phone, "車主聯絡電話"], [plate, "車牌號碼"]]
      .filter(([x]) => !x.value.trim()).map(([, n]) => n);
    if (miss.length) { alert("請填寫：" + miss.join("、")); return; }
    const who = d.needShop ? `店家代碼：${shop.value.trim()}` : "車主自行安裝";
    if (!confirm(`請確認登記資料：\n${late ? "保固起算：" + d.start : "安裝日期：" + date.value}\n${who}\n車牌：${fmtPlate(plate.value)}\n電話：${phone.value.trim()}\n\n登記後無法自行修改。`)) return;
    const busy = (on) => {   // 登記中：按鈕轉圈、欄位鎖住
      [btn, date, shop, phone, plate].forEach(x => x.disabled = on);
      btn.replaceChildren(...(on ? [el("span", { class: "spin" }), "登記中，請稍候…"] : [BTN]));
    };
    const fail = (t) => { msg.textContent = t; busy(false); alert(t); };
    busy(true); msg.textContent = "";
    try {
      const r = await api({ action: "register", s: SN, k: KEY, date: late ? "" : date.value, shop: d.needShop ? shop.value : "", phone: phone.value, plate: plate.value });
      if (r.ok) { render(r); window.scrollTo(0, 0); } else fail(r.error || "登記失敗，請稍後再試");
    } catch { fail("連線失敗，請稍後再試"); }
  });
  return form;
}

// 首頁（網址沒有序號）：掃碼說明 + 已登記車主用 電話 + 車牌 查詢 + 客服
// 常見問題文字 → [[問題, 答案], …]；「Q」開頭的行是問題，之後到下一個 Q 之前都是答案（答案開頭的「A：」會去掉）
function faqItems(text) {
  const items = [];
  String(text).split(/\r?\n/).forEach(line => {
    const t = line.trim(), q = t.match(/^Q\s*[：:.、]?\s*(.+)$/i);
    if (q) items.push([q[1], ""]);
    else if (items.length) { const last = items[items.length - 1]; last[1] += (last[1] ? "\n" : "") + t.replace(/^A\s*[：:.、]?\s*/i, ""); }
  });
  return items.map(([q, a]) => [q, a.trim()]).filter(([q, a]) => q && a);
}

// 常見問題卡片（首頁與保固頁共用）；沒有內容回傳 null
function faqCard(text) {
  const qa = faqItems(text || "");
  if (!qa.length) return null;
  return el("div", { class: "card" }, el("h2", {}, "常見問題"),
    ...qa.map(([q, a]) => el("details", { class: "qa" }, el("summary", {}, q), el("div", { class: "desc" }, ...richText(a)))));
}

function landing() {
  const phone = el("input", { type: "tel", inputmode: "numeric", maxlength: "15", placeholder: "例如 0912345678" });
  const plate = el("input", { type: "text", maxlength: "10", autocapitalize: "characters", autocomplete: "off", placeholder: "例如 ABC-1234" });
  phone.addEventListener("input", () => { const v = phone.value.replace(/\D/g, ""); if (v !== phone.value) phone.value = v; });
  plate.addEventListener("input", () => { const v = plate.value.toUpperCase().replace(/[^A-Z0-9-]/g, ""); if (v !== plate.value) plate.value = v; });
  const msg = el("p", { class: "err" });
  const btn = el("button", { type: "submit" }, "查詢保固");
  const form = el("form", { class: "card", novalidate: "" },
    el("h2", {}, "已登記車主查詢"),
    el("p", { class: "note" }, "請輸入保固登記時填寫的車主聯絡電話與車牌號碼。"),
    el("label", {}, "車主聯絡電話"), phone, el("label", {}, "車牌號碼"), plate, btn, msg);
  const support = el("div", {}, "客服資訊載入中…");
  const products = el("div");   // 產品介紹（由試算表「產品」頁載入）
  const faq = el("div", { id: "faq" });   // 常見問題（有資料才顯示）
  app.replaceChildren(
    el("section", { class: "hero" }, el("div", { class: "kicker" }, "WARRANTY & SUPPORT"),
      el("h1", {}, "JB 產品保固查詢"),
      el("p", {}, "用手機掃描產品貼紙上的 QR Code，即可查詢保固或進行保固登記。"),
      el("div", { class: "hero-links" },
        el("a", { href: "register.html" }, "📝 保固登記教學", el("small", {}, "掃 QR Code・約 1 分鐘")),
        el("a", { href: "install.html" }, "🔧 自行安裝手冊", el("small", {}, "圖文步驟・約 20 分鐘")))),
    form, faq, products,
    el("div", { class: "card" }, el("h2", {}, "聯絡我們"), el("p", { class: "note" }, "產品介紹、安裝、保固或 QR Code 無法掃描等任何問題，歡迎與我們聯繫："), support));
  api({ action: "info" }).then(r => {
    support.replaceChildren(...supportNodes(r && r.support));
    const fc = faqCard((r && r.faq) || "");
    if (fc) {
      faq.append(fc);
      if (location.hash === "#faq") faq.scrollIntoView();   // 從 LINE 等處用 #faq 連過來
    }
    const list = (r && r.products) || [];
    if (list.length) products.append(el("h2", { class: "section" }, "產品介紹"));
    list.forEach(p => {
      products.append(plateBox(p), featureCard(p));
      const extra = [manualLine(p),
        p.terms ? el("details", { class: "terms-box" }, el("summary", {}, "保固與注意事項"), el("div", { class: "desc terms" }, ...richText(p.terms))) : null]
        .filter(Boolean);
      if (extra.length) products.append(el("div", { class: "card" }, ...extra));
    });
  }).catch(() => support.replaceChildren("客服資訊準備中"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const miss = [[phone, "車主聯絡電話"], [plate, "車牌號碼"]].filter(([x]) => !x.value.trim()).map(([, n]) => n);
    if (miss.length) { alert("請填寫：" + miss.join("、")); return; }
    const busy = (on) => {
      [btn, phone, plate].forEach(x => x.disabled = on);
      btn.replaceChildren(...(on ? [el("span", { class: "spin" }), "查詢中，請稍候…"] : ["查詢保固"]));
    };
    const fail = (t) => { msg.textContent = t; busy(false); alert(t); };
    busy(true); msg.textContent = "";
    try {
      const r = await api({ action: "find", phone: phone.value, plate: plate.value });
      if (!r.ok) return fail(r.error || "查詢失敗，請稍後再試");
      const back = () => app.append(el("p", {}, el("a", { href: "./" }, "← 返回查詢")));
      if (r.items.length === 1) { render(r.items[0]); back(); return; }
      // 同一組電話 + 車牌登記多台：列出讓車主選
      app.replaceChildren(el("div", { class: "card" }, el("h2", {}, `找到 ${r.items.length} 筆保固資料`),
        ...r.items.map(it => {
          const [cls, txt] = STATUS[it.status] || ["b-warn", it.status];
          const b = el("button", { type: "button", class: "pick" },
            el("div", {}, it.model + "　" + (it.name || "")), el("div", { class: "note" }, "SN: " + it.sn + "　"), el("span", { class: "badge " + cls }, txt));
          b.addEventListener("click", () => { render(it); back(); });
          return b;
        })));
      back();
    } catch { fail("連線失敗，請稍後再試"); }
  });
}

// 底部版本：用 GitHub 發布時間（document.lastModified）自動產生，每次上傳都會變，不用手動改
{ const t = new Date(document.lastModified), p2 = n => String(n).padStart(2, "0");
  if (!isNaN(t)) document.getElementById("ver").textContent = `v${t.getFullYear()}.${p2(t.getMonth() + 1)}.${p2(t.getDate())}-${p2(t.getHours())}${p2(t.getMinutes())}`; }

(async () => {
  if (!SN || !KEY) { landing(); return; }
  try { render(await api({ s: SN, k: KEY })); }
  catch { app.replaceChildren(el("div", { class: "card" }, el("p", { class: "err" }, "連線失敗，請稍後再試"))); }
})();
</script>
